name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # New stdlib CVEs land without us pushing anything, so scan weekly too.
    - cron: '17 6 * * 1'

# go.mod declares go 1.23.0 as the language floor. CI builds with the latest
# stable toolchain instead: govulncheck reports stdlib advisories against the
# toolchain that built the binary, and pinning an old minor pins its unpatched
# standard library along with it.
env:
  GO_VERSION: 'stable'
  GOLANGCI_LINT_VERSION: 'v2.12.2'

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reconsync_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']

    env:
      RECONSYNC_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/reconsync_test?sslmode=disable

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Tests
        run: go test -race -coverpkg=./internal/...,./pkg/... ./tests/...

      # Blocking gate (§8.1): tenant B must never reach tenant A's data.
      - name: Tenant isolation
        run: go test -race ./tests/... -run 'Store/TenantIsolation' -v

  # The SDKs are tested against fixtures the Go signer produced, so a change to
  # signing that only the Go tests cover would still fail here. That is the
  # point: three implementations of one signature is exactly where a silent
  # divergence would live.
  sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Node SDK
        working-directory: sdk/node
        run: |
          npm ci
          npm run build
          npx tsc --noEmit -p tsconfig.test.json
          node --test test/*.test.js

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python SDK
        working-directory: sdk/python
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/ -q

  security:
    runs-on: ubuntu-latest
    steps:
      # Full history: gitleaks scans the commit range <first-pushed>^..<last>,
      # and a shallow clone has no parent for the first commit, so git cannot
      # resolve the range and the scan fails before it reads a single byte.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
